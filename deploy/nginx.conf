# nginx.conf
# Nginx 反向代理与同源部署配置文件 (Docker 挂载使用)

server {
    listen       80;
    server_name  localhost; # 浏览器访问地址 (本地开发通常为 localhost)

    # 1. 部署前端网页静态资源
    location / {
        root   /usr/share/nginx/html/dist; # 挂载到容器内的前端静态资源目录
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # 支持 Vue/React History 路由，防刷新 404
    }

    # 2. 反向代理网关接口 (匹配所有以 /api/ 开头的请求)
    location /api/ {
        # host.docker.internal 为 Docker 容器访问宿主机 (Mac) 服务的专用域名
        proxy_pass http://host.docker.internal:8080; 
        
        # 3. 传递客户端真实 IP 与协议信息 (用于网关限流、防刷和风控判定)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 4. 超时时间调优 (适配大模型 AI 导购连接时间长的特性)
        proxy_connect_timeout 15s;
        proxy_read_timeout    600s; # 等待后端大模型流式响应超时时间 (长连接防断连)
        proxy_send_timeout    600s;

        # 5. 支持 Server-Sent Events (SSE) 流式打字机效果所必须的配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;        # 极其关键！关闭缓冲区，使大模型生成的 Token 能即时推送，防止卡顿
        proxy_cache off;            # 禁用静态缓存
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

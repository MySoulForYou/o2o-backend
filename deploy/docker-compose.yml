name: o2o-project

services:
  # 1. MySQL 8.0 服务
  mysql:
    image: mysql:8.0
    container_name: o2o-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root  # 数据库 root 密码
      - TZ=Asia/Shanghai
    volumes:
      - ./docker-data/mysql/data:/var/lib/mysql      # 数据持久化，防止丢失
      - ./docker-data/mysql/conf:/etc/mysql/conf.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always

  # 2. Redis 7.0 服务
  redis:
    image: redis:7.0
    container_name: o2o-redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis/data:/data
    command: redis-server --appendonly yes # 开启 AOF 数据持久化
    restart: always

  # 3. RabbitMQ 3.x (带管理界面)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: o2o-rabbitmq
    ports:
      - "5672:5672"   # 业务通信端口
      - "15672:15672" # 网页管理控制台端口
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./docker-data/rabbitmq/data:/var/lib/rabbitmq
    restart: always

  # 4. Nacos 2.x (单机模式)
  nacos:
    image: nacos/nacos-server:v2.2.3
    platform: linux/amd64  # 强制使用兼容模式运行，解决苹果 M 系列芯片报错
    container_name: o2o-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone # 单机启动模式
      - JVM_XMS=256m    # 限制内存占用
      - JVM_XMX=256m
    restart: always

  # 5. Qdrant 向量数据库 (用于大模型商铺语义搜索)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: o2o-qdrant
    ports:
      - "6333:6333" # HTTP API 端口
      - "6334:6334" # gRPC 通信端口 (LangChain4j 默认与向量库通信端口)
    volumes:
      - ./docker-data/qdrant/storage:/qdrant/storage
    restart: always

  # 6. Nginx 反向代理与同源部署服务 (新)
  nginx:
    image: nginx:latest
    container_name: o2o-nginx
    ports:
      - "80:80" # 映射外部 HTTP 80 端口到容器
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # 挂载本地配置文件 (只读)
      - ./dist:/usr/share/nginx/html/dist              # 挂载前端打包静态资源文件
    extra_hosts:
      - "host.docker.internal:host-gateway" # 支持 Linux 环境及不同芯片下的宿主机解析
    depends_on:
      - nacos # 在注册中心启动后再启动
    restart: always
